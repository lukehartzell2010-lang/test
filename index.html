<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08070d">
  <title>JJK Archive — Loading iPhone UI Polish v2</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 70% 0,#7440d82b,transparent 36%),#08070d;color:#f7f4ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loader{text-align:center}.mark{width:66px;height:66px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid #9f66ff80;border-radius:20px;background:#9f66ff18;color:#b58aff;font:32px Georgia;box-shadow:0 0 45px #7440d840}.orb{width:38px;height:38px;margin:24px auto;border:3px solid #ffffff18;border-top-color:#a66cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font:500 clamp(28px,8vw,34px) Georgia;margin:0 0 10px;text-wrap:balance}p{color:#aaa4b8;line-height:1.6;margin:0}.error{width:min(100%,620px);border:1px solid #ff6e8f55;border-radius:18px;background:#ff6e8f0c;padding:22px;text-align:left}.error b{color:#ff9bb2}.error code{display:block;margin-top:12px;color:#cfc7d9;white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main class="loader" id="loading">
    <div class="mark">呪</div>
    <h1>Polishing the archive for iPhone…</h1>
    <p>Assembling 173 records, the reasoning engines, Deep Dossier v4, UI Polish v2, and fail-safe motion.</p>
    <div class="orb"></div>
  </main>
  <script>
    const files = [
      ...Array.from({length:13},(_,i)=>`.upgrade/plain-${String(i+1).padStart(2,"0")}.part`),
      ".upgrade/plain-14a.part",
      ".upgrade/plain-14b.part",
      ".upgrade/plain-14c.part",
      ...Array.from({length:15},(_,i)=>`.upgrade/tail-${String(i+1).padStart(2,"0")}.part`)
    ];

    async function loadArchive(){
      try{
        const parts=await Promise.all(files.map(async file=>{
          const response=await fetch(`${file}?v=20260717ui2`,{cache:"no-store"});
          if(!response.ok)throw new Error(`${file} returned ${response.status}`);
          return response.text();
        }));
        const html=parts.join("");
        const requiredMarkers=[
          "window.JJK_KNOWLEDGE",
          "document.documentElement.dataset.appReady",
          ".upgrade/semantic-engine-v4.js",
          "Semantic Question Engine v4",
          ".upgrade/cv5-01.part",
          "Complex Reasoning Engine v5",
          ".upgrade/response-quality-v5-1.js",
          "Response Quality Engine v5.1",
          ".upgrade/mobile-layout-v1.css",
          ".upgrade/ui-polish-v2.css",
          "iPhone-first UI Polish v2",
          ".upgrade/motion-system-v1.js",
          "Motion System v1.1"
        ];
        const missing=requiredMarkers.filter(marker=>!html.includes(marker));
        if(missing.length){
          throw new Error(`Base archive markers missing: ${missing.join(", ")}`);
        }
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML=`<main class="loader error"><b>The archive could not finish loading.</b><p>The loader found a deployment problem. Try reopening the page after a moment.</p><code>${String(error.message||error)}</code></main>`;
      }
    }
    loadArchive();
  </script>
</body>
</html>
